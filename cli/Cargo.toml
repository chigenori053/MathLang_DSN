[package]
name = "mathlang-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "mathlang"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9.12"
mathlang-mirp = { path = "../mirp" }
mathlang-verification = { path = "../verification" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
