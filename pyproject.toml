[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlang-dsn"
version = "0.3.0"
description = "Deterministic mathematical inference model for MathLang"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
mathlang-dsn = "mathlang_dsn.__main__:main"

[tool.setuptools]
packages = ["mathlang_dsn"]

[tool.setuptools.package-data]
mathlang_dsn = ["model.rsn", "polynomial.rsn", "knowledge.rsn", "junior_high.rsn", "cr_surface.rsn", "semantic_representation.rsn", "japanese_semantic_adapter.rsn", "memory_codec_f4.rsn", "common_representation_cr.rsn", "math_adapter_stage2a.rsn", "code_adapter_stage2a.rsn", "reason.toml"]
